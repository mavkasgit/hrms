name: test-backend

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: hrms_user
          POSTGRES_PASSWORD: hrms_pass
          POSTGRES_DB: hrms_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U hrms_user -d hrms_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Node/Python versions come from mise.toml + mise.lock (no setup-node/setup-python).
      - uses: jdx/mise-action@v5
        with:
          cache: true

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json', 'frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        run: mise run install

      - name: Verify profile-settings manifest (strict)
        run: mise exec -- python scripts/verify-profile-settings.py verify --strict

      - name: Create isolated run-DB
        env:
          # Service Postgres on :5432 (fresh container per job → fixed run-id is safe).
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5432"
          TEST_DB_ADMIN_USER: hrms_user
          TEST_DB_ADMIN_PASSWORD: hrms_pass
        run: mise exec -- python scripts/test-db.py create hrms_test_0c0ffeec0dec

      - name: pytest xdist
        env:
          # App Settings load repo .env.dev (DATABASE_URL :5435). Override for GHA
          # service Postgres on :5432 so API tests that hit the real app connect.
          ENV_FILE: /dev/null
          DATABASE_URL: postgresql+asyncpg://hrms_user:hrms_pass@localhost:5432/hrms_test
          DATABASE_URL_LOCAL: postgresql+asyncpg://hrms_user:hrms_pass@localhost:5432/hrms_test
          # Launcher-style per-run isolated DB (strictly validated by conftest).
          TEST_DATABASE_URL: postgresql+asyncpg://hrms_user:hrms_pass@localhost:5432/hrms_test_0c0ffeec0dec
          # Templates live under backend/data/ (gitignored) — docx content tests
          # must tolerate missing template fallback in CI.
          ONLYOFFICE_ENABLED: "false"
        run: mise run test-backend-ci

      - name: Drop run-DB
        if: always()
        env:
          TEST_DB_HOST: localhost
          TEST_DB_PORT: "5432"
          TEST_DB_ADMIN_USER: hrms_user
          TEST_DB_ADMIN_PASSWORD: hrms_pass
        run: mise exec -- python scripts/test-db.py drop hrms_test_0c0ffeec0dec
