name: sync

# Синк-гейт hrms <-> ktm2000. Оба репозитория чекаутятся рядом, скрипт запускается
# из корня hrms. Известный долг — scripts/sync-baseline.json (path + kind + hash;
# печатается как known), новое расхождение или изменившийся файл валит job.
#
# Токен: ktm2000 — приватный репозиторий, github.token его не видит. Без секрета
# SYNC_TOKEN checkout ниже вернёт 404 «Not Found», и это НЕ значит «репозитория
# нет»: так выглядит отсутствие прав. Добавьте fine-grained PAT (Contents: Read
# на mavkasgit/ktm2000) в Settings → Secrets and variables → Actions → SYNC_TOKEN.

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight — токен доступа к ktm2000
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "::warning::SYNC_TOKEN не задан. Для приватного mavkasgit/ktm2000 следующий checkout вернёт 404 «Not Found» — это отсутствие прав, а не отсутствие репозитория. Добавьте fine-grained PAT (Contents: Read) в Settings → Secrets and variables → Actions."
          else
            echo "SYNC_TOKEN задан — checkout ktm2000 пойдёт от имени PAT."
          fi

      - name: Checkout hrms
        uses: actions/checkout@v4
        with:
          path: hrms

      - name: Checkout ktm2000
        uses: actions/checkout@v4
        with:
          repository: mavkasgit/ktm2000
          path: ktm2000
          token: ${{ secrets.SYNC_TOKEN || github.token }}

      - name: Diagnose checkout failure
        if: failure()
        run: |
          echo "::error::Checkout ktm2000 не удался. Если в логе «Not Found» — почти наверняка не задан SYNC_TOKEN (приватный репозиторий) или у PAT нет Contents: Read на mavkasgit/ktm2000. Проверьте Settings → Secrets and variables → Actions → SYNC_TOKEN."

      # Скрипт использует только node:fs/node:path/node:url — зависимости не нужны.
      - name: Verify sync (baseline)
        working-directory: hrms
        run: node scripts/verify-sync.mjs --other ../ktm2000 --baseline scripts/sync-baseline.json
