# Dedicated Postgres for backend pytest (host port 5436 by default).
# Does not replace docker-compose.test.yml (full e2e stack) or dev Postgres (:5435).
name: hrms-pytest-db

services:
  postgres-pytest:
    image: postgres:15-alpine
    container_name: hrms-postgres-pytest
    # Параллельные pytest-прогоны соседних worktree делят этот сервер: при
    # дефолтном max_locks_per_transaction=64 они падают с `out of shared memory`.
    # 256 держит 3–4 одновременных набора; при нехватке — `PYTEST_NUM_WORKERS=2`.
    command: ["postgres", "-c", "max_locks_per_transaction=256"]
    # Оба loopback-биндинга обязательны: asyncpg резолвит 'localhost' на ::1
    # первым и виснет ~2с на [::1], если порт опубликован только на IPv4
    # (Docker Desktop, Windows). С [::1] и 127.0.0.1 коннект мгновенный.
    # Только loopback — порт не выходит за пределы машины.
    ports:
      - "127.0.0.1:${PYTEST_POSTGRES_PORT:-5436}:5432"
      - "[::1]:${PYTEST_POSTGRES_PORT:-5436}:5432"
    environment:
      POSTGRES_USER: hrms_user
      POSTGRES_PASSWORD: hrms_pass
      POSTGRES_DB: hrms_test
    # tmpfs speeds up ephemeral test DBs on Linux; Docker Desktop on Windows may ignore it.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrms_user -d hrms_test"]
      interval: 5s
      timeout: 5s
      retries: 10
