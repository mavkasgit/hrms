# HRMS toolchain. Единый вход: mise run install / check / dev.
# Версии рантаймов меняются только здесь; зависимости приложения живут в
# package.json и backend/requirements.txt. Глобальный ~/.config/mise/config.toml
# даёт node/gh/uv, но проект пинит то, от чего зависит воспроизводимость.
min_version = "2026.10.25"

[tools]
# Node 26 — фактический рантайм проекта (Node 20 EOL 30.04.2026, 24 — maintenance).
node = "26.13.0"
# Backend написан под 3.11+. Это версия для создания backend/.venv на чистой
# машине; существующий venv не пересоздаётся (см. _.python.venv ниже).
python = "3.14.10"

[env]
PYTHONUTF8 = "1"
PYTHONIOENCODING = "utf-8"
# Единственный интерпретатор проекта: backend/.venv. mise активирует его в
# задачах, mise exec и активированном шелле, поэтому dev/install/check
# используют один и тот же Python. На чистой машине venv создаётся сам.
_.python.venv = { path = "backend/.venv", create = true }

[settings]
# Детерминированно создавать venv через `python -m venv` (с pip), даже если
# глобально установлен uv: uv-venv по умолчанию идёт без pip.
python.venv_stdlib = true

[tasks.install]
description = "Установить Node- и Python-зависимости проекта"
# npm run setup = npm install + frontend install (postinstall ставит Chromium).
# pip ставит библиотеки в backend/.venv из _.python.venv.
run = [
  "npm run setup",
  "python -m pip install -r backend/requirements.txt",
]

[tasks.lint]
description = "TypeScript strict + production-сборка frontend (ESLint в проекте не настроен)"
run = "npm --prefix frontend run build"

[tasks.test]
description = "Frontend unit (vitest) + backend pytest с изолированной БД"
run = [
  "npm --prefix frontend run test",
  "npm run test:pytest",
]

[tasks.test-backend-ci]
description = "pytest для CI: service Postgres, без PowerShell-лаунчера"
run = "cd backend && python -m pytest -n auto --dist=loadfile -q"

[tasks.check]
description = "Блокирующий полный гейт: контракт profile-settings, сборка, тесты"
# CI повторяет те же шаги; e2e вынесен в отдельную задачу (нужен стенд).
run = [
  "python scripts/verify-profile-settings.py verify --strict",
  "mise run lint",
  "mise run test",
]

[tasks.dev]
description = "Локальный DEV: DB + миграции + backend + frontend"
run = "npm run dev"

[tasks.e2e]
description = "Playwright smoke (нужен поднятый TEST- или DEV-стенд)"
run = "npm run test:e2e:smoke"

[tasks.ports]
description = "Проверить, что dev-порты 8011/5171 свободны"
run = "npm run dev:ports"
