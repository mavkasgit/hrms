# Конфигурация markdown-линтера rumdl — шаг гейта `docs-lint`.
# Версия инструмента пинуется в mise.toml; реестр — docs/quality/tools.json.
#
# Принцип: ловим структурные дефекты, которые ломают рендер и ссылки
# (списки, заголовки, fences, относительные ссылки), а не вкус форматирования.

[global]
# MD013 (длина строки) выключен осознанно: русская проза в docs/ пишется
# абзацем в одну строку, а перенос — работа форматтера, а не гейта.
# Дефолт markdownlint (80) рассчитан на английский с жёстким переносом.
disable = ["MD013"]
# Кэш выключен: прогон по репозиторию занимает доли секунды, а кэш оставляет
# `.rumdl_cache` в корне, которого там быть не должно.
cache = false
# Сгенерированное и служебное: не исходники проекта. `node_modules` и venv
# исключены, чтобы прогон не зависел от состояния локальной установки.
exclude = [
  "node_modules/**",
  "frontend/node_modules/**",
  "backend/.venv/**",
  "test-results/**",
  "playwright-report/**",
  "logs/**",
  ".scratch/**",
  # Исторические планы и спеки: фиксируют состояние на дату. Править их
  # задним числом значит искажать историю; узкое исключение, не глобальное.
  "docs/superpowers/**",
]

[per-file-ignores]
# Шаблон PR: заголовок задаёт GitHub, тело начинается с разделов. H1 в теле
# pull request не нужен, а MD041 требует его в каждом файле.
".github/pull_request_template.md" = ["MD041"]
# README переносимых модулей сверяются с ktm2000 побайтово по hash
# (scripts/sync-manifest.json): правка fence требует парного изменения и bump
# версии модуля. Это отдельный тикет по ktm2000, а не работа docs-lint.
"frontend/src/modules/notifications/README.md" = ["MD040"]
"frontend/src/modules/user-settings/README.md" = ["MD040"]
